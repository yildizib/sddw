name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

          git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}"
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main; then
            echo "Release tag is not on origin/main: $RELEASE_TAG"
            exit 1
          fi

      - name: Validate tagged source
        run: |
          tools/validate-boundaries.sh
          git ls-files -z '*.sh' | xargs -0 -n 1 bash -n
          git ls-files -z '*.sh' | xargs -0 shellcheck
          tools/test-installers.sh

      - name: Build distribution package
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${RELEASE_TAG}"
          git archive \
            --format=zip \
            --prefix="${PACKAGE_NAME}/" \
            --output="${PACKAGE_NAME}.zip" \
            "$RELEASE_TAG"

          test -s "${PACKAGE_NAME}.zip"
          unzip -l "${PACKAGE_NAME}.zip"
          unzip -t "${PACKAGE_NAME}.zip"
          sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256"

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${RELEASE_TAG}"
          gh release create "$RELEASE_TAG" \
            "${PACKAGE_NAME}.zip" \
            "${PACKAGE_NAME}.zip.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
