name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi

      - name: Build distribution package
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${GITHUB_REF_NAME}"
          git archive \
            --format=zip \
            --prefix="${PACKAGE_NAME}/" \
            --output="${PACKAGE_NAME}.zip" \
            "$GITHUB_REF_NAME"

          test -s "${PACKAGE_NAME}.zip"
          unzip -l "${PACKAGE_NAME}.zip"

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" \
            "${PACKAGE_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
