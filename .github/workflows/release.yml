name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to package, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out the tagged revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi

      - name: Build distribution package
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${RELEASE_TAG}"
          git archive --format=tar --prefix="${PACKAGE_NAME}/" "$RELEASE_TAG" | tar -xf -

          # The repository keeps this symlink for Claude compatibility. Replace
          # it in the distribution tree so ZIP consumers receive real files.
          rm -f "${PACKAGE_NAME}/commands"
          cp -R "${PACKAGE_NAME}/adapters/claude/commands" "${PACKAGE_NAME}/commands"

          zip -qr "${PACKAGE_NAME}.zip" "$PACKAGE_NAME"

          test -s "${PACKAGE_NAME}.zip"
          unzip -l "${PACKAGE_NAME}.zip"
          unzip -t "${PACKAGE_NAME}.zip"

      - name: Create GitHub Release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          PACKAGE_NAME="sddw-${RELEASE_TAG}"
          gh release create "$RELEASE_TAG" \
            "${PACKAGE_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --generate-notes
