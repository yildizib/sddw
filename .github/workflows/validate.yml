name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  boundaries-and-installers:
    name: Validate on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes shellcheck

      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck

      - name: Validate shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -n 1 bash -n

      - name: Run ShellCheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

      - name: Validate core and adapter boundaries
        run: tools/validate-boundaries.sh

      - name: Smoke test global snapshot installers
        run: bash tools/test-installers.sh
