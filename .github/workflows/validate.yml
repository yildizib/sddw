name: Validate

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  boundaries-and-installers:
    name: Validate core boundaries and installers
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate core and adapter boundaries
        run: tools/validate-boundaries.sh

      - name: Validate shell scripts
        run: bash -n bin/install.sh adapters/claude/install.sh adapters/opencode/install.sh tools/install-adapter.sh tools/test-installers.sh

      - name: Smoke test global snapshot installers
        run: bash tools/test-installers.sh
